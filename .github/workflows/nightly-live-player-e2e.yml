# Nightly live-player Playwright E2E (emulator-backed, multi-context).
name: Nightly live-player E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Git ref with live-player E2E code (PR branch)
        required: true
        default: cursor/live-player-test-program-46fb
        type: string
      validation_passes:
        description: Consecutive serial suite passes required after preflight
        required: false
        default: "3"
        type: string
  push:
    branches:
      - cursor/live-player-test-program-46fb
    paths:
      - .github/live-player-e2e-run

concurrency:
  group: nightly-live-player-e2e
  cancel-in-progress: true

jobs:
  live-player-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIXED_PUBLIC_TABLES_SERVER_ENABLED: "true"
    steps:
      - name: Checkout E2E branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Cloud Functions
        run: npm run build:functions

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Start Firebase emulators
        run: |
          export MIXED_PUBLIC_TABLES_SERVER_ENABLED=true
          npm run emulators > /tmp/firebase-emulators.log 2>&1 &
          echo $! > /tmp/emulator.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4000 >/dev/null; then
              echo "Emulators ready (UI :4000)"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:4000 >/dev/null; then
            echo "Emulator startup failed"
            tail -50 /tmp/firebase-emulators.log
            exit 1
          fi
          echo "MIXED_PUBLIC_TABLES_SERVER_ENABLED=${MIXED_PUBLIC_TABLES_SERVER_ENABLED}"

      - name: Smoke-check public matchmaking flag + index rebuild
        env:
          MIXED_PUBLIC_TABLES_SERVER_ENABLED: "true"
        run: node scripts/smoke-public-table-index.mjs

      - name: Validate live-player E2E (preflight + consecutive passes)
        env:
          LIVE_PLAYER_VALIDATION_PASSES: ${{ github.event.inputs.validation_passes || '3' }}
          LIVE_PLAYER_E2E_RETRIES: "0"
        run: node scripts/run-live-player-nightly-validation.mjs

      - name: Upload live-player diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-player-diagnostics-${{ github.run_id }}
          path: |
            test-results/live-player-preflight.json
            test-results/live-player-nightly-validation.json
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-player-playwright-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore

      - name: Stop emulators
        if: always()
        run: |
          if [ -f /tmp/emulator.pid ]; then
            kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true
          fi
